<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind custom config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50:  "#eff6ff",
                100: "#dbeafe",
                500: "#3b82f6",
                600: "#2563eb",
                700: "#1d4ed8",
              },
              accent: {
                400: "#fb923c",
                500: "#f97316",
                600: "#ea580c",
              },
            },
            fontFamily: {
              sans: ['"Inter"', "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-primary-50 min-h-screen font-sans text-gray-800">

    <!-- ===== HEADER ===== -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
      <div class="max-w-2xl mx-auto px-4 py-4 flex items-center gap-3">
        <!-- App icon -->
        <div class="w-8 h-8 bg-primary-500 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5"
               viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Task List</h1>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-6">

      <!-- ADD TASK CARD -->
      <section aria-label="Add new task"
               class="bg-white rounded-2xl shadow-md p-5 border border-gray-100">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">
          New Task
        </h2>
        <form id="task-form" class="flex gap-3" novalidate>
          <input
            id="task-input"
            type="text"
            placeholder="What needs to be done?"
            maxlength="120"
            autocomplete="off"
            class="flex-1 rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm
                   text-gray-800 placeholder-gray-400 outline-none transition
                   focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
            aria-label="Task name"
          />
          <button
            type="submit"
            id="add-btn"
            class="flex items-center gap-1.5 bg-primary-500 hover:bg-primary-600 active:bg-primary-700
                   text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition-colors
                   focus:outline-none focus:ring-2 focus:ring-primary-300 cursor-pointer"
          >
            <!-- Plus icon -->
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5"
                 viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
            </svg>
            Add
          </button>
        </form>
        <!-- Inline validation message -->
        <p id="input-error" class="hidden text-xs text-red-500 mt-2 ml-1" role="alert"></p>
      </section>

      <!-- TASK LIST CARD -->
      <section aria-label="Task list"
               class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">

        <!-- Filter tabs + summary -->
        <div class="flex items-center justify-between px-5 pt-5 pb-3 gap-3 flex-wrap">
          <div class="flex gap-1 bg-gray-100 rounded-xl p-1" role="tablist" aria-label="Filter tasks">
            <button data-filter="all"
                    class="filter-tab active-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all cursor-pointer"
                    role="tab" aria-selected="true">All <span id="count-all" class="tabcount">(0)</span></button>
            <button data-filter="active"
                    class="filter-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all cursor-pointer"
                    role="tab" aria-selected="false">Active <span id="count-active" class="tabcount">(0)</span></button>
            <button data-filter="completed"
                    class="filter-tab px-4 py-1.5 rounded-lg text-sm font-medium transition-all cursor-pointer"
                    role="tab" aria-selected="false">Completed <span id="count-completed" class="tabcount">(0)</span></button>
          </div>
        </div>

        <!-- Divider -->
        <div class="border-t border-gray-100 mx-5"></div>

        <!-- Task items container -->
        <ul id="task-list" class="divide-y divide-gray-100 min-h-[80px]" role="list"
            aria-label="Task items">
        </ul>

        <!-- Empty state (shown when list is empty) -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-14 text-center px-6">
          <div class="w-14 h-14 bg-primary-50 rounded-full flex items-center justify-center mb-4">
            <svg class="w-7 h-7 text-primary-300" fill="none" stroke="currentColor" stroke-width="1.5"
                 viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
          </div>
          <p class="text-gray-500 font-medium text-sm">No tasks here</p>
          <p class="text-gray-400 text-xs mt-1">Add a task above to get started!</p>
        </div>

        <!-- Footer: clear completed -->
        <div id="list-footer"
             class="hidden items-center justify-between px-5 py-3 border-t border-gray-100 bg-gray-50">
          <span id="active-count" class="text-xs text-gray-400 font-medium"></span>
          <button id="clear-completed-btn"
                  class="text-xs font-medium text-accent-500 hover:text-accent-600 transition-colors
                         focus:outline-none focus:underline cursor-pointer">
            Clear completed
          </button>
        </div>

      </section>
    </main>

    <!-- ===== EDIT MODAL ===== -->
    <div id="modal-overlay"
         class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4"
         role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 space-y-4">
        <h2 id="modal-title" class="text-base font-semibold text-gray-900">Edit Task</h2>
        <input
          id="edit-input"
          type="text"
          maxlength="120"
          class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-2.5 text-sm
                 text-gray-800 outline-none transition focus:border-primary-500 focus:ring-2 focus:ring-primary-100"
          aria-label="Edit task name"
        />
        <p id="edit-error" class="hidden text-xs text-red-500 -mt-2 ml-1" role="alert"></p>
        <div class="flex gap-3 justify-end">
          <button id="modal-cancel"
                  class="px-4 py-2 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100
                         transition-colors focus:outline-none cursor-pointer">
            Cancel
          </button>
          <button id="modal-save"
                  class="px-5 py-2 rounded-xl text-sm font-semibold bg-primary-500 hover:bg-primary-600
                         text-white transition-colors focus:outline-none focus:ring-2 focus:ring-primary-300 cursor-pointer">
            Save
          </button>
        </div>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
